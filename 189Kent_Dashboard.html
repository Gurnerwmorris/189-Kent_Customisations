// ─── HELPERS ────────────────────────────────────────────────────────────────
function pd(s){ return s ? new Date(s) : null; }
function df(s){ var d=pd(s); if(!d) return null; return Math.round((d-TODAY)/86400000); }
function fmt(s){
  if(!s) return "—";
  return pd(s).toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"});
}
function fmtP(p){ return p ? "$"+(p/1e6).toFixed(2)+"M" : "—"; }
function bicCol(b){
  if(BIC_COL[b]) return BIC_COL[b];
  // For several people, use the colour of the first one we recognise.
  var known=bicParts(b).filter(function(p){return BIC_COL[p.toUpperCase()];});
  return known.length ? BIC_COL[known[0].toUpperCase()] : "#888";
}
// Units with no bespoke lot clause that still follow the full customisation steps,
// so they appear on the Gantt chart with every step.
var GANTT_ALSO_INCLUDE = ["1901N"];
// Next Steps cells hold several dated notes in one string, e.g.
// "24.03.26_WIM issued letter. 16/03/26 - WM confirmed riser ...".
// Return only the most recent dated note: {date:"24/03/26", text:"WIM issued letter."}.
// If there are no dates, return the whole text.
function latestNote(s){
  s = String(s||"").trim();
  if(!s) return null;
  var re = /(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/g, m, hits=[];
  while((m = re.exec(s))){
    var y = +m[3]; if(y<100) y += 2000;
    var d = new Date(y, +m[2]-1, +m[1]);
    if(!isNaN(d)) hits.push({i:m.index, end:re.lastIndex, d:d,
      label:("0"+m[1]).slice(-2)+"/"+("0"+m[2]).slice(-2)+"/"+String(y).slice(-2)});
  }
  if(!hits.length) return {date:null, text:s};
  var best = hits.reduce(function(a,b){ return b.d>=a.d ? b : a; });
  var next = hits.filter(function(h){ return h.i>best.i; })[0];
  var text = s.slice(best.end, next ? next.i : s.length).replace(/^[\s_\-–:]+/,"").trim();
  return {date:best.label, text:text||s};
}
function onGanttAnyway(u){ return GANTT_ALSO_INCLUDE.indexOf(String(u.unit||"").trim().toUpperCase()) >= 0; }

function getStage(u){
  if(u.confirm)      return {label:"1.7 Letter #2 Signed",                  pct:85, color:"#4caf82"};
  if(u.qsEst)        return {label:"1.6 Letter #2 Issued",                  pct:72, color:"#4caf82"};
  if(u.cad)          return {label:"1.5 CAD Plans Issued",                  pct:60, color:"#4caf82"};
  if(u.costsIssued)  return {label:"1.4 Letter #1 Signed",                  pct:35, color:"#c9a84c"};
  if(u.layoutApproved) return {label:"1.3 Letter #1 Issued",                pct:25, color:"#c9a84c"};
  if(u.layoutDesign) return {label:"1.2.1 Layout Approved",                 pct:20, color:"#c9a84c"};
  if(u.sketch)       return {label:"1.2 Sketch Issued",                     pct:15, color:"#c9a84c"};
  if(u.brief && pd(u.brief)<=TODAY) return {label:"Brief Due — Sketch Pending", pct:8, color:"#e06060"};
  if(u.brief)        return {label:"Brief Pending",                          pct:3,  color:"#555"};
  return               {label:"Not Started",                                 pct:0,  color:"#7a736a"};
}

// ─── UNITS + ACTIONS TAB ─────────────────────────────────────────────────────

  var stateFB=useState("ALL"); var filterBespoke=stateFB[0],setFB=stateFB[1];
  var stateFBIC=useState("ALL"); var filterBic=stateFBIC[0],setFBIC=stateFBIC[1];
  var stateSK=useState(null); var sortKey=stateSK[0],setSortKey=stateSK[1];
  var stateSD=useState("asc"); var sortDir=stateSD[0],setSortDir=stateSD[1];
  function handleSort(key){
    if(sortKey===key) setSortDir(sortDir==="asc"?"desc":"asc");
    else { setSortKey(key); setSortDir("asc"); }
  }

  var bicGroups={};
  UNITS.forEach(function(u){ if(!u.bic)return; if(!bicGroups[u.bic])bicGroups[u.bic]=[]; bicGroups[u.bic].push(u); });
  var allBics=Object.keys(bicGroups).sort();

  var filtered=UNITS.filter(function(u){
    if(filterStatus!=="ALL"&&u.status!==filterStatus) return false;
    if(filterBespoke==="YES"&&!u.bespoke) return false;
    if(filterBespoke==="NO"&&u.bespoke) return false;
    if(filterBic!=="ALL"&&u.bic!==filterBic) return false;
    return true;
  });
  if(sortKey){
    var getters={
      unit:function(u){return u.unit||"";},
      name:function(u){return u.name||"";},
      agent:function(u){return u.agent||"";},
      price:function(u){return u.price||0;},
      status:function(u){return u.status||"";},
      stage:function(u){return getStage(u).label||"";},
      spec:function(u){return u.spec||"";},
      sketch:function(u){return u.sketch?1:0;},
      curStatus:function(u){return u.curStatus||"";},
      bic:function(u){return u.bic||"";},
      exchanged:function(u){return u.exchanged||"";},

      bespoke:function(u){return u.bespokeLot||"";},
      ff:function(u){return u.friendsFamily||"";},
    };
    if(getters[sortKey]){
      var getter=getters[sortKey];
      filtered=filtered.slice().sort(function(a,b){
        var av=getter(a),bv=getter(b);

      ["ALL","EXCHANGED","ISSUED"].map(function(f){return h(FBtn,{key:f,label:f,active:filterStatus===f,onClick:function(){setFS(f);}});}),
      h("div",{style:{width:1,height:16,background:"#e0dbd2",margin:"0 4px"}}),

      ["ALL","YES","NO"].map(function(f){return h(FBtn,{key:f,label:f,active:filterBespoke===f,onClick:function(){setFB(f);}});}),
      h("div",{style:{width:1,height:16,background:"#e0dbd2",margin:"0 4px"}}),
      h("span",{style:{fontSize:10,color:"#7a736a",letterSpacing:"0.08em",textTransform:"uppercase",marginRight:2}},"BIC:"),
      ["ALL"].concat(allBics).map(function(f){return h(FBtn,{key:f,label:f,active:filterBic===f,onClick:function(){setFBIC(f);}});})
    ),
    // Table
    h("div",{style:{background:"#ffffff",border:"1px solid #e0dbd2",borderRadius:4,overflowX:"auto"}},
      h("div",{style:{minWidth:"1800px"}},
      h("div",{style:{display:"grid",gridTemplateColumns:"90px 200px 100px 110px 125px 55px 52px 60px 40px 42px 60px 110px 170px 1fr 36px",

        [

          {label:"Plan",        key:null},
          {label:"Comms",       key:null},

          {label:"Cur. Status", key:"curStatus"},
          {label:"Next Steps",  key:null},

        ].map(function(col){
          var active = col.key && sortKey===col.key;
          return h("div",{key:col.label,

      {n:"3.2", contract:true, label:"DoV and SA Invoice Issued to Client",         clause:"SC 68(b)(ii)(J)",   timing:"Issued after QS certification", desc:"Vendor drafts and issues Deed of Variation formally documenting agreed bespoke works, amended plans and specifications, and price adjustment."},
      {n:"3.3", contract:true, label:"Client Executes DoV",                         clause:"SC 68(b)(ii)(K)",   timing:"14 calendar days after DoV issued, or Date for Completion (whichever earlier)", desc:"Purchaser must execute the Deed of Variation within 14 days. Note: contract is automatically amended under SC 68(c) regardless of whether the purchaser executes the DoV."},
      {n:"3.4", contract:true, label:"Deposit Top-Up Paid",                         clause:"SC 68(b)(ii)(L)",   timing:"Within 10 business days of DoV date, or Date for Completion (whichever earlier)", desc:"Deposit amended to 10% of revised price. Purchaser pays outstanding balance — or vendor refunds overpayment if price decreased — within 10 business days of the Deed of Variation date."},
    ]},
    {color:"#4ecece",phase:"Phase 4 — Delivery",steps:"Construction & planning approvals",milestones:[
      {n:"4.1", contract:true, label:"Instructed to Builder",                       clause:"Internal programme", timing:"DoV Execution Date", desc:"Builder instructed to proceed with bespoke works."},
      {n:"4.2", contract:true, label:"Planning / DA Modification Submission",       clause:"Internal programme", timing:"DoV execution + 60 days", desc:"Recommended latest date to submit planning modification application to the relevant Consent Authority."},
      {n:"4.3", contract:true, label:"Modification Approval",                       clause:"Clause 33.1 / SC 68(e)", timing:"Fixed contractual sunset date", desc:"Deadline by which s.4.55 DA modification approval must be obtained. Delivery of consolidated/customised lot is conditional on this approval (SC 68(e))."},
      {n:"4.4", contract:true, label:"Project Completion Deadline / Registration of Strata Plan", clause:"Sunset Table",       timing:"Calculated", desc:"Deadline for project completion and registration of the strata plan with the Land Registry Services."},
    ]},
  ];

  return h("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,alignItems:"start"}},
    PHASES.map(function(phase){
      return h("div",{key:phase.phase,
        style:{border:"1px solid "+phase.color+"33",borderTop:"3px solid "+phase.color,
          borderRadius:"0 0 4px 4px",background:"#ffffff",overflow:"hidden"}},
        h("div",{style:{padding:"10px 12px",background:phase.color+"08",borderBottom:"1px solid "+phase.color+"22"}},
          h("div",{style:{display:"flex",alignItems:"center",gap:6,marginBottom:3}},
            h("div",{style:{width:9,height:9,borderRadius:"50%",background:phase.color,flexShrink:0}}),
            h("span",{style:{fontSize:13,fontWeight:600,color:"#2a2520"}},phase.phase)
          ),
          h("div",{style:{fontSize:9,color:phase.color,letterSpacing:"0.07em",textTransform:"uppercase",paddingLeft:15}},phase.steps)
        ),
        phase.milestones.map(function(m){
          return h("div",{key:m.n,
            style:{padding:"8px 12px",borderBottom:"1px solid #f5f3ef",
              borderLeft:"3px solid "+(m.contract?phase.color:phase.color+"44"),
              background:m.contract?"#ffffff":"#fdfcfb"}},
            h("div",{style:{display:"flex",alignItems:"baseline",gap:6,marginBottom:3}},
              h("span",{style:{fontSize:10,fontWeight:700,color:phase.color,minWidth:26,flexShrink:0}},m.n),
              h("span",{style:{fontSize:11,color:"#2a2520",fontWeight:m.contract?600:400,flex:1,lineHeight:1.3}},m.label),
              h("span",{style:{fontSize:8,color:"#bbb5ad",flexShrink:0,whiteSpace:"nowrap"}},m.clause)
            ),
            h("div",{style:{paddingLeft:32}},
              h("div",{style:{fontSize:10,color:"#6a6058",lineHeight:1.5,marginBottom:3}},m.desc),
              h("div",{style:{fontSize:9,color:phase.color+"bb",letterSpacing:"0.03em"}},"⏱ "+m.timing)
            )
          );
        }),
        // Contract note at bottom
        h("div",{style:{padding:"6px 12px",background:"#f9f8f6",borderTop:"1px solid #ebe7e0"}},
          h("div",{style:{fontSize:8,color:"#9a9490",letterSpacing:"0.04em"}},
            "█ Contractual milestone  ░ Gurner internal step"
          )
        )
      );
    })
  );
}

// ─── GANTT TAB ───────────────────────────────────────────────────────────────
function GanttTab(props){
  var onOpen = props.onOpen;
  var stateShowIssued = useState(false);
  var showIssued = stateShowIssued[0], setShowIssued = stateShowIssued[1];

  // ── TARGET PROGRAMME ────────────────────────────────────────────────────────
  // Project-wide target dates for each customisation step (same for every bespoke unit).
  // notBefore = the step can't start before this date.
  // dateOnly  = the tracker only holds a due date for this step, not a YES tick,
  //             so it can never show as "done" — only as pending or overdue.
  // To change the programme, edit the dates below.
  var PHASES = {
    design:  {label:"1 — Design",            color:"#4c9af0"},
    cost:    {label:"2 — Cost",              color:"#b06cd0"},
    dov:     {label:"3 — Variation / DoV",   color:"#4caf82"},
    joinery: {label:"4 — Joinery shop drawings", color:"#c9a84c"},
    build:   {label:"5 — Manufacture & install", color:"#4ecece"},
  };
  var PROGRAMME = [
    {key:"sketch",         n:"1.2",   phase:"design", target:"2027-02-04", label:"Sketch Plan Issued"},
    {key:"layoutDesign",   n:"1.2.1", phase:"design", target:"2027-02-04", label:"Layout Approved", critical:true},
    {key:"layoutApproved", n:"1.3",   phase:"design", target:"2027-02-04", label:"Letter #1 Issued: cost range and layout", purchaser:true},
    {key:"costsIssued",    n:"1.4",   phase:"design", target:"2027-02-04", label:"Letter #1 Signed / layout approved (outstanding approvals)", critical:true, purchaser:true},
    {key:"cad",            n:"1.5",   phase:"design", target:"2027-02-09", label:"Layout converted to CAD / revised interiors and joinery package"},
    {key:"qsEst",          n:"1.6",   phase:"design", target:"2027-02-23", notBefore:"2026-12-31", label:"Letter #2 Issued: interiors and updated cost range"},
    {key:"confirm",        n:"1.7",   phase:"design", target:"2027-03-09", label:"Letter #2 Signed: interiors and updated cost range agreed", critical:true, purchaser:true},
    {key:"designEnd",      n:"1.8",   phase:"design", target:"2027-03-10", label:"Move to Phase 2 / Cost (working target; contractual deadline remains COS-dependent)", dateOnly:true},
    {key:"builder",        n:"2.1",   phase:"cost",   target:"2027-05-14", label:"Hickory final customisation pricing completed"},
    {key:"commercial",     n:"2.3",   phase:"cost",   target:"2027-05-21", label:"Internal commercial review completed"},
    {key:"qsCert",         n:"2.2",   phase:"cost",   target:"2027-06-09", label:"QS cost certification completed", critical:true, dateOnly:true},
    {key:"dovDeadline",    n:"3.3",   phase:"dov",    target:"2027-06-16", label:"Purchaser accepts final certified variation price", critical:true, purchaser:true, dateOnly:true},
    {key:"hickory",        n:"4.1",   phase:"dov",    target:"2027-06-23", label:"Variation assessed, approved and instructed", critical:true, dateOnly:true},
    {key:"j1",             n:"J1",    phase:"joinery",target:"2027-06-28", label:"Joiner commences shop drawings", dateOnly:true},
    {key:"j2",             n:"J2",    phase:"joinery",target:"2027-08-23", label:"Joiner issues first shop-drawing submission", dateOnly:true},
    {key:"j3",             n:"J3",    phase:"joinery",target:"2027-09-06", label:"Gurner/FJC return consolidated shop-drawing comments", dateOnly:true},
    {key:"j4",             n:"J4",    phase:"joinery",target:"2027-09-20", label:"Joiner resubmits revised shop drawings", dateOnly:true},
    {key:"j5",             n:"J5",    phase:"joinery",target:"2027-10-05", label:"Gurner/FJC complete final shop-drawing review", dateOnly:true},
    {key:"j6",             n:"J6",    phase:"joinery",target:"2027-10-18", label:"Approved shop drawings issued for manufacture", dateOnly:true},
    // Carcass install: Level 7 start per tower; higher floors follow their own program dates (TBC)
    {key:"carcass",        n:"Install", phase:"build", target:{S:"2028-03-02", N:"2028-03-14"}, label:"Kitchen/wardrobe carcass installation starts (Level 7 date; higher floors follow their program)", dateOnly:true, tbc:true},
  ];
  // Phase bands drawn behind each row
  var BANDS = [
    {phase:"design",  from:"2026-11-01", to:"2027-03-10"},
    {phase:"cost",    from:"2027-03-10", to:"2027-06-09"},
    {phase:"dov",     from:"2027-06-09", to:"2027-06-23"},
    {phase:"joinery", from:"2027-06-28", to:"2027-10-18"},
    {phase:"build",   from:"2027-10-18", to:{S:"2028-03-02", N:"2028-03-14"}, note:"Site measure, production, orders, manufacture, shipping and delivery — TBC with Hickory/joiner"},
  ];

  function towerOf(u){ return /N\s*$/i.test(String(u.unit||"")) ? "N" : "S"; }
  function tgt(step,u){ return typeof step.target === "string" ? step.target : step.target[u ? towerOf(u) : "S"]; }
  function stepDone(step,u){ return step.dateOnly ? false : !!u[step.key]; }

  var CRITICAL_COL = "#2a5584";
  function darken(hex, amt){
    var n = parseInt(String(hex).replace("#","").slice(0,6),16);
    var f = function(c){ return Math.round(c*(1-amt)).toString(16).padStart(2,"0"); };
    return "#"+f((n>>16)&255)+f((n>>8)&255)+f(n&255);
  }

  var ganttUnits = UNITS.filter(function(u){
    if(u.bespokeLot !== "YES" && !onGanttAnyway(u)) return false;
    if(!showIssued && u.status==="ISSUED") return false;
    return true;
  }).sort(function(a,b){
    // Apartment number order, lowest first. Amalgamations sort by their first number; N before S.
    function key(u){
      var s = String(u.unit||"").toUpperCase(), m = s.match(/\d+/);
      return { n: m ? +m[0] : 99999, t: (s.match(/[NS]/)||["Z"])[0] };
    }
    var ka = key(a), kb = key(b);
    return ka.n - kb.n || (ka.t < kb.t ? -1 : ka.t > kb.t ? 1 : 0);
  });

  var NOTES_W = 230;              // "Next Steps" box beside the unit details
  var LABEL_W = 270 + NOTES_W;
  var ROW_H   = 56;

  // Timeline: Oct 2026 → Apr 2028
  var minD = new Date("2026-10-01");
  var maxD = new Date("2028-04-30");
  var totalDays = Math.round((maxD - minD) / 86400000);
  var CHART_W = Math.max(1100, window.innerWidth - LABEL_W - 56);
  var DPX = CHART_W / totalDays;
  function xp(d){ return d ? Math.round((new Date(d)-minD)/86400000*DPX) : null; }
  var todayX = xp(TODAY);
  function fmtD(d){ return new Date(d).toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"2-digit"}); }
  function daysTo(d){ return Math.round((new Date(d)-TODAY)/86400000); }

  var months = [];
  var mc = new Date(minD.getFullYear(),minD.getMonth(),1);
  while(mc <= maxD){
    months.push({ label: mc.toLocaleDateString("en-AU",{month:"short",year:"2-digit"}), x: xp(mc) });
    mc = new Date(mc.getFullYear(),mc.getMonth()+1,1);
  }

  // Diamond x positions: steps sharing a target sit side by side ending at that date,
  // and every diamond keeps at least MIN_GAP px from the one before (tooltips give the exact date).
  var MIN_GAP = 15;
  function layout(u){
    var groups = {};
    PROGRAMME.forEach(function(s){ var t=tgt(s,u); groups[t]=(groups[t]||0)+1; });
    var seen = {}, prev = -Infinity, out = {};
    PROGRAMME.forEach(function(s){
      var t = tgt(s,u); seen[t]=(seen[t]||0)+1;
      var ideal = xp(t) - (groups[t]-seen[t])*MIN_GAP;
      var x = Math.max(ideal, prev + MIN_GAP);
      out[s.key] = x; prev = x;
    });
    return out;
  }

  function Diamond(p){
    var s = p.step, st = p.status, col = PHASES[s.phase].color;
    var fill = "transparent", border, size = s.purchaser ? 13 : 11, shadow = "none";
    if(st==="done"){ var c = s.critical ? CRITICAL_COL : col; fill = c; border = "2px solid "+c; shadow = "0 0 4px "+c+"55"; }
    else if(st==="overdue"){ border = "2px solid #c94040"; fill = "#fdecec"; }
    else if(s.dateOnly){ border = "1px dashed "+col+"aa"; }
    else { border = (s.critical ? "2px solid "+darken(col,0.35) : "2px solid "+col+"99"); fill = "#fff"; }
    return h("div",{className:"gd",style:{position:"absolute",left:(p.x-size/2)+"px",top:(p.top-size/2)+"px",zIndex:5},
      onMouseEnter:function(e){ var t=e.currentTarget.querySelector(".dtip"); if(t) t.style.display="block"; },
      onMouseLeave:function(e){ var t=e.currentTarget.querySelector(".dtip"); if(t) t.style.display="none"; }},
      h("div",{style:{width:size,height:size,background:fill,border:border,transform:"rotate(45deg)",
        boxShadow:shadow,boxSizing:"border-box",cursor:"default"}}),
      h("div",{className:"dtip",style:{display:"none",position:"absolute",bottom:size+6,left:"50%",transform:"translateX(-50%)",
        background:"#1e1c19",color:"#f0ede8",padding:"4px 8px",borderRadius:3,fontSize:9,whiteSpace:"nowrap",
        boxShadow:"0 2px 6px rgba(0,0,0,0.4)",pointerEvents:"none",zIndex:30,borderLeft:"2px solid "+col,lineHeight:1.45}},
        h("div",{style:{fontWeight:600}},(st==="done"?"✓ ":"")+s.n+" "+s.label+(s.critical?" (critical)":"")),
        h("div",null,"Target: "+fmtD(p.date)+(s.tbc?" (Level 7 — higher floors later)":"")+
          (st==="done" ? " · done" : st==="overdue" ? " · OVERDUE "+Math.abs(daysTo(p.date))+"d" : " · in "+daysTo(p.date)+"d")),
        s.notBefore ? h("div",null,"Can't start before "+fmtD(s.notBefore)) : null,
        s.dateOnly && st!=="done" ? h("div",{style:{color:"#bbb5ad"}},"No YES tick in tracker for this step") : null)
    );
  }

  function statusOf(s,u){
    if(stepDone(s,u)) return "done";
    if(new Date(tgt(s,u)) < TODAY) return "overdue";
    return "pending";
  }

  function bandsFor(u, top, height){
    return BANDS.map(function(b){
      var to = typeof b.to === "string" ? b.to : b.to[u ? towerOf(u) : "S"];
      var x1 = xp(b.from), x2 = xp(to), col = PHASES[b.phase].color;
      return h("div",{key:b.phase,title:PHASES[b.phase].label+": "+fmtD(b.from)+" – "+fmtD(to)+(b.note?" · "+b.note:""),
        style:{position:"absolute",left:x1+"px",width:Math.max(x2-x1,2)+"px",top:top+"px",height:height+"px",
          background:b.phase==="build" ? "repeating-linear-gradient(45deg,"+col+"10 0 6px,"+col+"22 6px 12px)" : col+"12",
          border:"1px solid "+col+"33",borderRadius:2,zIndex:0}});
    });
  }

  var notBeforeSteps = PROGRAMME.filter(function(s){ return s.notBefore; });

  return h("div", {style:{background:"#ffffff",border:"1px solid #e0dbd2",borderRadius:4,padding:20}},

    // Header
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}},
      h("div",null,
        h("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:15,color:"#1a1714"}},"Customisation Programme — Target Dates"),
        h("div",{style:{fontSize:10,color:"#7a736a",marginTop:2}},
          "Project-wide target dates for every bespoke unit. Diamonds sit at each step's target; filled = done in the tracker, red = past target and not done.")),
      h("label",{style:{display:"flex",alignItems:"center",gap:6,fontSize:11,color:"#555",cursor:"pointer"}},
        h("input",{type:"checkbox",checked:showIssued,onChange:function(e){setShowIssued(e.target.checked);},
          style:{accentColor:"#c9a84c"}}),
        "Include Issued units")
    ),

    // Phase summary strip
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8,margin:"10px 0 14px"}},
      [
        {p:"design",  when:"to 10 Mar 27", steps:"Layout approvals by 4 Feb → CAD 9 Feb → Letter #2 issued 23 Feb (not before 31 Dec 26) → signed 9 Mar → Move to Cost 10 Mar"},
        {p:"cost",    when:"10 Mar – 9 Jun 27", steps:"Hickory pricing 14 May → Commercial review 21 May → QS certification 9 Jun"},
        {p:"dov",     when:"9 – 23 Jun 27", steps:"Purchaser accepts certified price 16 Jun → Variation approved and instructed 23 Jun"},
        {p:"joinery", when:"28 Jun – 18 Oct 27", steps:"Start 28 Jun → 1st submission 23 Aug → comments 6 Sep → resubmit 20 Sep → final review 5 Oct → approved for manufacture 18 Oct"},
        {p:"build",   when:"Oct 27 – Mar 28", steps:"Manufacture and delivery TBC with Hickory/joiner → L7 carcass install: S 2 Mar 28, N 14 Mar 28 (higher floors later)"},
      ].map(function(ph){
        var P = PHASES[ph.p];
        return h("div",{key:ph.p,style:{border:"1px solid "+P.color+"33",borderTop:"3px solid "+P.color,
          borderRadius:"0 0 3px 3px",background:"#fff",padding:"8px 10px"}},
          h("div",{style:{fontSize:11,fontWeight:600,color:"#2a2520",marginBottom:2}},P.label),
          h("div",{style:{fontSize:8,color:P.color,letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:4}},ph.when),
          h("div",{style:{fontSize:9,color:"#7a736a",lineHeight:1.5}},ph.steps));
      })
    ),

    // Legend
    h("div",{style:{display:"flex",gap:16,flexWrap:"wrap",alignItems:"center",padding:"7px 12px",marginBottom:12,
      background:"#f9f8f6",borderRadius:3,border:"1px solid #ebe7e0",fontSize:10,color:"#4a4540"}},
      [
        {d:{background:"#4c9af0",border:"2px solid #4c9af0"}, t:"Done (YES in tracker)"},
        {d:{background:CRITICAL_COL,border:"2px solid "+CRITICAL_COL}, t:"Critical step done (1.2.1, 1.4, 1.7, 2.2, 3.3, 4.1)"},
        {d:{background:"#fff",border:"2px solid #4c9af099"}, t:"Pending"},
        {d:{background:"#fdecec",border:"2px solid #c94040"}, t:"Past target, not done"},
        {d:{background:"transparent",border:"1px dashed #888"}, t:"Target only (no YES tick in tracker)"},
        {d:{width:13,height:13,background:"#fff",border:"2px solid #888"}, t:"Larger = purchaser sign-off"},
      ].map(function(l,i){
        return h("div",{key:i,style:{display:"flex",alignItems:"center",gap:6}},
          h("div",{style:Object.assign({width:10,height:10,transform:"rotate(45deg)",boxSizing:"border-box",flexShrink:0},l.d)}),
          h("span",null,l.t));
      }),
      h("div",{style:{display:"flex",alignItems:"center",gap:5}},
        h("div",{style:{width:0,height:13,borderLeft:"2px dashed #8a6d3b"}}), h("span",null,"Not-before date")),
      h("div",{style:{display:"flex",alignItems:"center",gap:5}},
        h("div",{style:{width:2,height:13,background:"#e06060"}}), h("span",null,"Today"))
    ),

    h("div",{style:{overflowX:"auto"}},
      h("div",{style:{minWidth:(CHART_W+LABEL_W+8)+"px"}},

        // Month row
        h("div",{style:{marginLeft:LABEL_W+"px",position:"relative",height:20,borderBottom:"1px solid #ebe7e0",marginBottom:4}},
          months.map(function(m,i){
            return h("div",{key:i,style:{position:"absolute",left:m.x+"px",fontSize:9,color:"#bbb5ad",
              letterSpacing:"0.06em",textTransform:"uppercase",whiteSpace:"nowrap"}},m.label);
          }),
          h("div",{style:{position:"absolute",left:todayX+"px",top:0,height:"100%",width:1,background:"#e0606066"}})
        ),

        // Programme row — the master target dates
        h("div",{style:{display:"flex",alignItems:"center",marginBottom:8,paddingBottom:6,borderBottom:"2px solid #e0dbd2"}},
          h("div",{style:{width:LABEL_W+"px",flexShrink:0,paddingRight:8}},
            h("div",{style:{fontSize:12,fontWeight:600,color:"#2a2520"}},"Target programme"),
            h("div",{style:{fontSize:9,color:"#7a736a"}},"Applies to every bespoke unit · hover a diamond for its date")),
          h("div",{style:{position:"relative",height:ROW_H+"px",flex:1}},
            bandsFor(null, 10, 36),
            BANDS.map(function(b){
              var to = typeof b.to === "string" ? b.to : b.to.S;
              var w = xp(to) - xp(b.from);
              var name = PHASES[b.phase].label.replace(/^\d — /,"");
              if(w < 90) name = b.phase==="dov" ? "DoV" : "";   // narrow band: short label so it doesn't run into the next one
              return h("div",{key:"lbl"+b.phase,style:{position:"absolute",left:(xp(b.from)+4)+"px",top:12,fontSize:8,
                maxWidth:Math.max(w-6,0)+"px",overflow:"hidden",
                color:darken(PHASES[b.phase].color,0.3),letterSpacing:"0.05em",textTransform:"uppercase",whiteSpace:"nowrap",zIndex:1}},
                name);
            }),
            notBeforeSteps.map(function(s){
              return h("div",{key:"nb"+s.key,title:s.n+" "+s.label+" — can't start before "+fmtD(s.notBefore),
                style:{position:"absolute",left:xp(s.notBefore)+"px",top:0,height:ROW_H+"px",borderLeft:"2px dashed #8a6d3b",zIndex:3}},
                h("div",{style:{position:"absolute",left:4,top:ROW_H-14,fontSize:8,color:"#8a6d3b",whiteSpace:"nowrap"}},
                  s.n+" not before "+fmtD(s.notBefore)));
            }),
            (function(){
              var pos = layout(null);
              return PROGRAMME.map(function(s){
                return h(Diamond,{key:s.key,step:s,x:pos[s.key],top:36,date:tgt(s,null),status:"pending"});
              });
            })(),
            h("div",{style:{position:"absolute",left:todayX+"px",top:0,bottom:0,width:1,background:"#e06060",opacity:0.5,zIndex:10}})
          )
        ),

        // Unit rows
        ganttUnits.map(function(u){
          var stage = getStage(u);
          if(u.curStatus && !u.curStatus.startsWith("NA")){
            stage = {pct:stage.pct, label:u.curStatus,
              color: u.curStatus.startsWith("1.") && !u.curStatus.startsWith("1.0") ? "#5aa0b4"
                   : u.curStatus.startsWith("1.")  ? "#c9a84c"
                   : u.curStatus.startsWith("2.")  ? "#b06cd0"
                   : u.curStatus.startsWith("3.")  ? "#4caf82"
                   : u.curStatus.startsWith("4.")  ? "#4ecece"
                   : stage.color};
          }
          var pos = layout(u);
          // Next step not yet done (ticked steps only count as done)
          var nextStep = PROGRAMME.filter(function(s){ return !stepDone(s,u); })[0];
          var overdueCount = PROGRAMME.filter(function(s){ return statusOf(s,u)==="overdue"; }).length;

          return h("div",{key:u.unit,style:{display:"flex",alignItems:"center",marginBottom:6,
              borderBottom:"1px solid #e8e3da",paddingBottom:4,overflow:"visible"}},

            // LEFT LABEL
            h("div",{style:{width:LABEL_W+"px",flexShrink:0,paddingRight:6,display:"flex",alignItems:"center",gap:5}},
              h("button",{onClick:function(){onOpen(u);},title:"Full detail",
                style:{background:"#f0ede8",border:"1px solid #e0dbd2",color:"#6a6058",borderRadius:2,cursor:"pointer",
                  width:22,height:22,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,flexShrink:0}},"⊕"),
              h("div",{style:{width:(270-34)+"px",flexShrink:0,minWidth:0}},
                h("div",{style:{display:"flex",alignItems:"center",gap:5,marginBottom:1}},
                  h("div",{style:{width:125,flexShrink:0,display:"flex",alignItems:"center",gap:5}},
                    h("span",{style:{fontSize:12,color:"#c9a84c",fontWeight:500,letterSpacing:"0.03em",flexShrink:0}},u.unit),
                    h(BicBadge,{bic:u.bic})),
                  nextStep ? h("span",{title:"Next step: "+nextStep.n+" "+nextStep.label+" — target "+fmtD(tgt(nextStep,u)),
                    style:{fontSize:8,padding:"1px 4px",borderRadius:2,whiteSpace:"nowrap",
                      background:overdueCount?"#c9404018":"#4c9af015",color:overdueCount?"#c94040":"#3a7acc",
                      border:"1px solid "+(overdueCount?"#c9404044":"#4c9af044")}},
                    overdueCount ? overdueCount+" overdue" : "Next "+nextStep.n+" · "+fmtD(tgt(nextStep,u))) : null
                ),
                h("div",{style:{fontSize:9,color:"#7a736a",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginBottom:1}},u.name),
                h("div",{style:{fontSize:9,color:stage.color,letterSpacing:"0.03em",lineHeight:1.3,whiteSpace:"normal"}},stage.label)
              ),
              // NEXT STEPS box — latest note only
              (function(){
                var note = latestNote(u.nextSteps);
                return h("div",{title:note ? note.text : "",
                  style:{width:(NOTES_W-12)+"px",flexShrink:0,alignSelf:"stretch",background:"#faf8f4",border:"1px solid #e8e3da",
                    borderRadius:3,padding:"4px 7px",overflow:"hidden",display:"flex",flexDirection:"column",gap:2}},
                  h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:8,color:"#9a9288",
                    letterSpacing:"0.08em",textTransform:"uppercase"}},
                    h("span",null,"Next Steps"),
                    note && note.date ? h("span",{style:{letterSpacing:"0.03em"}},note.date) : null),
                  h("div",{style:{fontSize:9.5,color:note?"#3a3631":"#bbb5ad",lineHeight:1.3,
                    display:"-webkit-box",WebkitLineClamp:3,WebkitBoxOrient:"vertical",overflow:"hidden"}},
                    note ? note.text : "—"));
              })()
            ),

            // CHART AREA
            h("div",{style:{position:"relative",height:ROW_H+"px",flex:1,overflow:"visible"}},
              bandsFor(u, 12, 32),
              notBeforeSteps.map(function(s){
                return h("div",{key:"nb"+s.key,style:{position:"absolute",left:xp(s.notBefore)+"px",top:6,height:(ROW_H-12)+"px",
                  borderLeft:"1px dashed #8a6d3b88",zIndex:2}});
              }),
              PROGRAMME.map(function(s){
                return h(Diamond,{key:s.key,step:s,x:pos[s.key],top:28,date:tgt(s,u),status:statusOf(s,u)});
              }),
              h("div",{style:{position:"absolute",left:todayX+"px",top:0,bottom:0,width:1,background:"#e06060",opacity:0.5,zIndex:10}})
            )
          );
        }),

        // Today label
        h("div",{style:{marginLeft:LABEL_W+"px",position:"relative",height:14,marginTop:4}},
          h("div",{style:{position:"absolute",left:todayX+"px",transform:"translateX(-50%)",fontSize:9,color:"#e06060",letterSpacing:"0.04em"}},"▲ today"))
      )
    )
  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App(){
  var stateTab=useState("overview"); var tab=stateTab[0],setTab=stateTab[1];
  var stateModal=useState(null); var modalUnit=stateModal[0],setModalUnit=stateModal[1];

  // Close modal on Escape
  useEffect(function(){
    function onKey(e){ if(e.key==="Escape") setModalUnit(null); }
    window.addEventListener("keydown",onKey);
    return function(){ window.removeEventListener("keydown",onKey); };
  },[]);

  var exchanged=UNITS.filter(function(u){return u.status==="EXCHANGED";});
  var totalRev=exchanged.reduce(function(s,u){return s+(u.price||0);},0);
  var sketchDone=UNITS.filter(function(u){return u.sketch;}).length;
  var sketchPending=UNITS.filter(function(u){return u.bespoke&&!u.sketch&&u.status==="EXCHANGED";}).length;

  return h("div",{style:{background:"#f5f3ef",minHeight:"100vh",color:"#2a2520"}},
    // Header
    h("div",{style:{borderBottom:"1px solid #e8e3da",background:"#ffffff",padding:"16px 28px",display:"flex",alignItems:"center",justifyContent:"space-between"}},
      h("div",null,
        h("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:20,color:"#1a1714",letterSpacing:"0.02em"}},"189 Kent Street"),
        h("div",{style:{fontSize:10,color:"#7a736a",letterSpacing:"0.15em",textTransform:"uppercase",marginTop:1}},"Salus Place — Customisations Tracker")
      ),
      h("div",{style:{display:"flex",gap:18,alignItems:"center"}},
        [{l:"Sketches Issued",v:sketchDone+"/"+UNITS.length},
         {l:"Pending Sketches",v:sketchPending,red:sketchPending>0}
        ].map(function(k){
          return h("div",{key:k.l,style:{textAlign:"right"}},
            h("div",{style:{fontSize:9,color:"#7a736a",letterSpacing:"0.1em",textTransform:"uppercase"}},k.l),
            h("div",{style:{fontFamily:"'Playfair Display',serif",fontSize:17,
              color:k.gold?"#c9a84c":k.red&&k.v>0?"#e06060":"#e8e0d0"}},k.v)
          );
        }),
        h("div",{style:{width:1,height:28,background:"#e8e3da"}}),
        h("div",{style:{textAlign:"right"}},
          h("div",{style:{fontSize:9,color:"#7a736a",letterSpacing:"0.1em",textTransform:"uppercase"}},"Today"),
          h("div",{style:{fontSize:11,color:"#666"}},TODAY.toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"}))
        )
      )
    ),
    // Tabs
    h("div",{style:{borderBottom:"1px solid #e8e3da",padding:"0 28px",display:"flex"}},
      [{k:"overview",l:"Overview"},{k:"units",l:"Units & Actions"},{k:"gantt",l:"Gantt Chart"},{k:"phases",l:"Phases & Milestones"}].map(function(t){
        var active=tab===t.k;
        return h("button",{key:t.k,
          onClick:function(){setTab(t.k);},
          style:{padding:"10px 20px",background:"none",border:"none",
            borderBottom:"2px solid "+(active?"#c9a84c":"transparent"),
            color:active?"#c9a84c":"#555",cursor:"pointer",
            fontFamily:"'DM Sans',sans-serif",fontSize:12,letterSpacing:"0.08em",
            textTransform:"uppercase",transition:"all 0.2s"}},t.l);
      })
    ),
    // Content
    h("div",{style:{padding:"18px 12px"}},
      tab==="overview" && h(OverviewTab,null),
      tab==="units"    && h(UnitsTab,{onOpen:setModalUnit}),
      tab==="gantt"    && h(GanttTab,{onOpen:setModalUnit}),
      tab==="phases"   && h(PhasesTab,null)
    ),
    // Modal
    modalUnit && h(UnitModal,{unit:modalUnit,onClose:function(){setModalUnit(null);}})
  );
}

var root=ReactDOM.createRoot(document.getElementById("app"));
root.render(h(App,null));

})();
</script>
</body>
</html>
